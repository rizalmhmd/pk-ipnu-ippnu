<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="160">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardPayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cardAdminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <style>
      .step-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .step-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10px; font-weight: 400; fill: #6ee7b7; }
      .step-num { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10px; font-weight: 800; fill: #facc15; }
    </style>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(10, 25)" filter="url(#shadow)">
    <rect width="145" height="105" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="72" y="26" text-anchor="middle" class="step-num">LANGKAH 01</text>
    <text x="72" y="52" text-anchor="middle" font-size="22">🌐</text>
    <text x="72" y="74" text-anchor="middle" class="step-title">Calon Kader</text>
    <text x="72" y="92" text-anchor="middle" class="step-desc">Akses Portal Publik</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(162, 70)" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M0,8 L20,8 M15,3 L21,8 L15,13" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(192, 25)" filter="url(#shadow)">
    <rect width="145" height="105" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="72" y="26" text-anchor="middle" class="step-num">LANGKAH 02</text>
    <text x="72" y="52" text-anchor="middle" font-size="22">📰</text>
    <text x="72" y="74" text-anchor="middle" class="step-title">Portal &amp; Agenda</text>
    <text x="72" y="92" text-anchor="middle" class="step-desc">Pilih Kegiatan/Event</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(344, 70)" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M0,8 L20,8 M15,3 L21,8 L15,13" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(374, 25)" filter="url(#shadow)">
    <rect width="145" height="105" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="72" y="26" text-anchor="middle" class="step-num">LANGKAH 03</text>
    <text x="72" y="52" text-anchor="middle" font-size="22">📝</text>
    <text x="72" y="74" text-anchor="middle" class="step-title">Form Registrasi</text>
    <text x="72" y="92" text-anchor="middle" class="step-desc">Validasi Data + NIK</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(526, 70)" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M0,8 L20,8 M15,3 L21,8 L15,13" />
  </g>

  <!-- Step 4 -->
  <g transform="translate(556, 25)" filter="url(#shadow)">
    <rect width="155" height="105" rx="12" fill="url(#cardPayGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="77" y="26" text-anchor="middle" class="step-num" fill="#7dd3fc">LANGKAH 04</text>
    <text x="77" y="52" text-anchor="middle" font-size="22">💳</text>
    <text x="77" y="74" text-anchor="middle" class="step-title">Midtrans Pay</text>
    <text x="77" y="92" text-anchor="middle" class="step-desc" fill="#bae6fd">QRIS &amp; Virtual Account</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(718, 70)" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M0,8 L20,8 M15,3 L21,8 L15,13" />
  </g>

  <!-- Step 5 -->
  <g transform="translate(748, 25)" filter="url(#shadow)">
    <rect width="155" height="105" rx="12" fill="url(#cardAdminGrad)" stroke="#4ade80" stroke-width="1.5" />
    <text x="77" y="26" text-anchor="middle" class="step-num" fill="#86efac">SELESAI</text>
    <text x="77" y="52" text-anchor="middle" font-size="22">📊</text>
    <text x="77" y="74" text-anchor="middle" class="step-title">Dashboard &amp; KTA</text>
    <text x="77" y="92" text-anchor="middle" class="step-desc" fill="#bbf7d0">Auto Sync &amp; Rekap Data</text>
  </g>
</svg>
