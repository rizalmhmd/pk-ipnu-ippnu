<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5" />
    </linearGradient>
    <style>
      .footer-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #a7f3d0; }
      @keyframes waveM { 0% { transform: translateX(0); } 50% { transform: translateX(-20px); } 100% { transform: translateX(0); } }
      .foot-wave { animation: waveM 6s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#footerBg)" />
  <path class="foot-wave" fill="url(#footerWave)" d="M-30,40 C120,20 280,60 450,35 C620,10 750,55 930,35 L930,80 L-30,80 Z" />
  <text x="450" y="48" text-anchor="middle" class="footer-txt">💚 PKPT IPNU IPPNU UNSIQ • Belajar • Berjuang • Bertaqwa</text>
  <rect width="900" height="80" rx="12" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
