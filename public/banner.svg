<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#047857" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .sub-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 1px;
        fill: #a7f3d0;
      }
      .badge-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #fef08a;
      }
      .motto-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px) translateY(2px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.03); }
      }
      .animated-wave {
        animation: waveMotion 8s ease-in-out infinite;
      }
      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,40 H900 M0,80 H900 M0,120 H900 M0,160 H900 M0,200 H900" />
    <path d="M60,0 V240 M120,0 V240 M180,0 V240 M240,0 V240 M300,0 V240 M360,0 V240 M420,0 V240 M480,0 V240 M540,0 V240 M600,0 V240 M660,0 V240 M720,0 V240 M780,0 V240 M840,0 V240" />
  </g>

  <!-- Glowing Stars / Embellishments -->
  <circle cx="120" cy="50" r="2.5" fill="#facc15" opacity="0.7" class="pulse-item" />
  <circle cx="780" cy="65" r="3" fill="#6ee7b7" opacity="0.8" class="pulse-item" />
  <circle cx="820" cy="120" r="2" fill="#facc15" opacity="0.6" />
  <circle cx="80" cy="140" r="2" fill="#6ee7b7" opacity="0.6" />

  <!-- Animated Bottom Waves -->
  <path class="animated-wave" fill="url(#waveGrad1)" d="M-50,190 C150,165 320,225 500,195 C680,165 820,215 950,190 L950,240 L-50,240 Z" />
  <path class="animated-wave" fill="url(#waveGrad2)" d="M-50,205 C180,180 340,230 520,205 C700,180 840,220 950,205 L950,240 L-50,240 Z" opacity="0.8" />

  <!-- Top Pill / Badge -->
  <g transform="translate(325, 26)">
    <rect width="250" height="26" rx="13" fill="#022c22" fill-opacity="0.7" stroke="#10b981" stroke-width="1.2" />
    <circle cx="18" cy="13" r="4.5" fill="#10b981" />
    <text x="130" y="17" text-anchor="middle" class="badge-text">PORTAL RESMI &amp; SISTEM INFORMASI</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" font-size="38" class="title-text" filter="url(#glow)">PKPT IPNU IPPNU UNSIQ</text>
  <text x="450" y="105" text-anchor="middle" font-size="38" class="title-text">PKPT IPNU IPPNU UNSIQ</text>

  <!-- Subtitle -->
  <text x="450" y="136" text-anchor="middle" font-size="15" class="sub-text">Universitas Sains Al-Qur'an (UNSIQ) Jawa Tengah di Wonosobo</text>

  <!-- Bottom Tagline Pill / Motto -->
  <g transform="translate(300, 156)">
    <rect width="300" height="30" rx="15" fill="url(#goldGrad)" opacity="0.15" />
    <rect width="300" height="30" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1" />
    <text x="150" y="20" text-anchor="middle" class="motto-text" fill="#fef08a">✨ BELAJAR • BERJUANG • BERTAQWA ✨</text>
  </g>

  <!-- Border Accent on Card -->
  <rect width="900" height="240" rx="16" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />
</svg>
